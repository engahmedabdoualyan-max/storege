services:
  db:
    image: postgres:16-alpine
    container_name: storege-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: storege
      POSTGRES_PASSWORD: storege
      POSTGRES_DB: storege
    ports:
      - "5432:5432"
    volumes:
      - storege_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U storege -d storege"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: storege-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://storege:storege@db:5432/storege?schema=public
      JWT_SECRET: change-me-in-production-please
      JWT_EXPIRES_IN: 12h
      CORS_ORIGIN: "*"
      APP_URL: http://localhost:4000
      COMPANY_TIMEZONE: Africa/Cairo
      SEED_DB: "true"
    ports:
      - "4000:4000"

volumes:
  storege_pgdata:
